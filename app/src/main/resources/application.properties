# RecargaLab — configuração PROPOSITALMENTE INSEGURA (ver docs/GABARITO.md)
spring.application.name=recargalab
server.port=8080

spring.datasource.url=jdbc:postgresql://postgres:5432/recargalab
spring.datasource.username=recargalab
spring.datasource.password=${DB_PASSWORD:Recarga@2024!}

# O banco é recriado a cada inicialização: reiniciar o container reseta o laboratório.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

lab.jwt.secret=${JWT_SECRET:secret123}
lab.operadora.url=${OPERADORA_URL:http://operadora-mock:9000}
lab.operadora.api-key=${OPERADORA_API_KEY:sk_live_lab_9f8e7d6c5b4a3210}

# Lab 8 (A02:2025): Actuator totalmente exposto, sem autenticação e com valores visíveis
management.endpoints.web.exposure.include=*
management.endpoint.env.show-values=ALWAYS
management.endpoint.configprops.show-values=ALWAYS
management.endpoint.health.show-details=never

# Lab 8 (A10:2025): detalhes de erro devolvidos ao cliente
server.error.include-stacktrace=always
server.error.include-message=always

logging.level.br.com.wiser.recargalab=INFO
